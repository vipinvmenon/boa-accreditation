name: Verify deployment

# Vercel fires deployment_status when a deploy finishes. That is the only moment
# at which "what is live" is a question with a real answer — CI on push runs
# BEFORE the deploy, so it can never catch a config that silently did not apply.
#
# This has already earned its keep: checking by hand on 11 Sep found the service
# worker precaching three routes that 404, which would have made caches.addAll()
# reject and disabled offline support at the gate with no visible error.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to verify (defaults to the production domain)'
        required: false
  schedule:
    # 02:30 UTC = 08:00 IST — the daily reconcile named in docs/OPERATIONS.md.
    # A drift that appears without a deploy (a DNS change, a dashboard edit,
    # an expired cert) is invisible to a push-triggered check.
    - cron: '30 2 * * *'

jobs:
  verify:
    # Only for successful production deploys, or when a human asks.
    if: >
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify what is actually live
        run: |
          # deployment_status.environment_url is Vercel's unique per-deployment
          # alias (e.g. boa-accreditation-<hash>-vipin-menon.vercel.app), NOT
          # the custom domain — even for a Production deployment_status event.
          # That alias sits behind Vercel Deployment Protection (SSO) by
          # default and 302s to vercel.com/sso-api, which is not what a real
          # visitor ever hits. Found 14 Sep 2026: every deployment_status-
          # triggered run had been failing on this since the workflow's own
          # creation, unnoticed because nobody had checked `gh run list`
          # against it — the exact "document asserts a verification never
          # performed" pattern CLAUDE.md warns about. The custom domain is the
          # only URL worth verifying for an automatic run; only a manual
          # workflow_dispatch may override it.
          URL="${{ github.event.inputs.url }}"
          if [ -z "$URL" ]; then URL="https://accred.bangaloreopenair.com"; fi
          echo "Verifying $URL"
          corepack pnpm verify:deploy "$URL"
