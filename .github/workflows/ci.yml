name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      # `lint` runs check-design-tokens.mjs and audit-font-weights.mjs before
      # eslint. Both prove the transcription still matches design/source/.
      - run: corepack pnpm lint
      - run: corepack pnpm test
      - run: corepack pnpm build

  database:
    name: database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile

      # This job is REQUIRED, not advisory. boa-bar-control shipped its
      # equivalent with `continue-on-error: true` and a "FLIP THIS TO REQUIRED"
      # comment that was still there weeks later, so the suite never gated
      # anything.
      #
      # There is genuinely no database yet (ACC-009 is blocked on Vipin), so a
      # hard failure now would just train everyone to ignore a red tick. Instead
      # the exception is DATED and expires itself: from 20 Sep 2026 — Milestone
      # A, when the first invite links go out — a missing SUPABASE_DB_URL fails
      # the build. No human has to remember to flip anything.
      - name: Check the database secret
        id: gate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "have_db=true" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_DB_URL is set — running the suite."
            exit 0
          fi
          echo "have_db=false" >> "$GITHUB_OUTPUT"
          GRACE_ENDS=$(date -u -d '2026-09-20' +%s 2>/dev/null || date -u -j -f '%Y-%m-%d' '2026-09-20' +%s)
          NOW=$(date -u +%s)
          if [ "$NOW" -ge "$GRACE_ENDS" ]; then
            echo "::error::SUPABASE_DB_URL is not set and the grace period ended on 20 Sep 2026."
            echo "The pgTAP suite proves anon has zero grants and that quota is enforced"
            echo "server-side. Shipping without it is not an option. See docs/ROADMAP.md ACC-009."
            exit 1
          fi
          echo "::warning::SUPABASE_DB_URL not set. Skipping until the grace period ends on 2026-09-20 (ACC-009)."

      - name: Static migration check
        if: always()
        run: corepack pnpm check:sql || echo "::warning::check:sql not implemented yet (ACC-011)"

      - name: pgTAP
        if: steps.gate.outputs.have_db == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: corepack pnpm test:db

  design:
    name: design fidelity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install --with-deps chromium

      # The references are REGENERATED here rather than committed, and that is
      # deliberate. Capturing the approved bundle and rendering our app in the
      # same browser, in the same run, isolates "our app vs the design" from
      # "Chrome 130 vs Chrome 131". A committed PNG baseline would fail on a
      # runner image bump and teach everyone to regenerate the baseline, which
      # is the one move that destroys a visual gate.
      #
      # The baseline cannot drift silently: design/source/ is committed, so any
      # change to the contract itself shows up as a diff in review.
      # Verified 11 Sep: 28/28 captures are byte-identical across runs.
      - run: corepack pnpm design:reference
      - run: corepack pnpm build
      - run: corepack pnpm test:visual

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: |
            test-results/visual/
            design/reference/manifest.json
          retention-days: 14

  gate-e2e:
    name: gate aeroplane-mode suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install --with-deps chromium

      # tests/e2e/aeroplane-mode.spec.ts (ACC-057) is local-only and mocked at
      # the pull/issue boundary — no Supabase credentials, no production
      # routes. playwright.config.ts's webServer builds and serves the app
      # itself, so this needs no prior build step. Covers green/amber/red
      # decisions, blank-serial idempotency, and the two failure paths (401
      # queue preservation, 500 causal ordering) against real browser Dexie
      # with a true cold service-worker reload.
      - run: corepack pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-traces
          # playwright.config.ts uses the 'line' reporter (no HTML report);
          # this is where retry-on-failure traces/screenshots actually land.
          path: test-results/
          retention-days: 14
